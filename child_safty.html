<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Child Safety Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0e1a;
      --surface: #111827;
      --surface2: #1a2235;
      --surface3: #1f2d44;
      --border: rgba(99,179,255,0.12);
      --accent: #3b82f6;
      --accent2: #06b6d4;
      --green: #10b981;
      --red: #ef4444;
      --orange: #f59e0b;
      --yellow: #fbbf24;
      --text: #e2e8f0;
      --text2: #94a3b8;
      --text3: #64748b;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'Space Grotesk', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(59,130,246,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59,130,246,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .layout {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 260px 1fr;
      min-height: 100vh;
    }

    /* SIDEBAR */
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .sidebar-logo {
      padding: 24px 20px;
      border-bottom: 1px solid var(--border);
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      margin-bottom: 10px;
    }

    .logo-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text);
    }

    .logo-sub {
      font-size: 11px;
      color: var(--text3);
      font-family: var(--mono);
      margin-top: 2px;
    }

    .sidebar-section {
      padding: 20px 16px 12px;
    }

    .sidebar-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text3);
      margin-bottom: 8px;
      padding: 0 4px;
    }

    .sidebar-stats {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: var(--surface2);
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .stat-row-label {
      font-size: 12px;
      color: var(--text2);
    }

    .stat-row-val {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
    }

    .val-green { color: var(--green); }
    .val-red { color: var(--red); }
    .val-blue { color: var(--accent); }
    .val-orange { color: var(--orange); }

    .sidebar-actions {
      padding: 16px;
      margin-top: auto;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-emergency {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #dc2626, #991b1b);
      border: none;
      border-radius: 10px;
      color: white;
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-emergency:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(220,38,38,0.4);
    }

    .btn-emergency.active {
      animation: emergency-pulse 1s infinite;
    }

    @keyframes emergency-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(220,38,38,0.6); }
      50% { box-shadow: 0 0 0 8px rgba(220,38,38,0); }
    }

    .btn-stop-all {
      width: 100%;
      padding: 11px;
      background: var(--surface2);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 10px;
      color: #f87171;
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-stop-all:hover {
      background: rgba(239,68,68,0.1);
      border-color: rgba(239,68,68,0.5);
    }

    .btn-refresh-sidebar {
      width: 100%;
      padding: 11px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text2);
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-refresh-sidebar:hover {
      background: var(--surface3);
      color: var(--text);
    }

    /* MAIN CONTENT */
    .main {
      overflow-y: auto;
      padding: 0;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 30px;
      border-bottom: 1px solid var(--border);
      background: rgba(17,24,39,0.8);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .topbar-left h1 {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
    }

    .topbar-left p {
      font-size: 12px;
      color: var(--text3);
      font-family: var(--mono);
      margin-top: 2px;
    }

    .ws-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--surface2);
      border-radius: 20px;
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 500;
    }

    .ws-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      animation: blink 2s infinite;
    }

    .ws-dot.offline { background: var(--red); animation: none; }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .content {
      padding: 28px 30px;
    }

    /* DEVICE CARDS */
    .devices-list {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .device-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      transition: all 0.3s;
    }

    .device-card.buzzer-active {
      border-color: var(--red);
      box-shadow: 0 0 0 1px rgba(239,68,68,0.3), 0 20px 40px rgba(239,68,68,0.15);
    }

    .device-card.buzzer-active .device-header {
      background: linear-gradient(135deg, rgba(239,68,68,0.15), rgba(220,38,38,0.08));
    }

    .device-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 12px;
    }

    .device-header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .device-icon {
      width: 44px;
      height: 44px;
      background: var(--surface3);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .device-name {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
    }

    .device-id-text {
      font-size: 11px;
      font-family: var(--mono);
      color: var(--text3);
      margin-top: 2px;
    }

    .device-header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .badge {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      font-family: var(--mono);
      letter-spacing: 0.05em;
    }

    .badge-online { background: rgba(16,185,129,0.15); color: var(--green); border: 1px solid rgba(16,185,129,0.3); }
    .badge-offline { background: rgba(239,68,68,0.1); color: #f87171; border: 1px solid rgba(239,68,68,0.2); }
    .badge-buzzer { background: rgba(239,68,68,0.2); color: var(--red); border: 1px solid rgba(239,68,68,0.4); animation: badge-flash 0.8s infinite; }

    @keyframes badge-flash {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .buzzer-btns {
      display: flex;
      gap: 8px;
    }

    .btn-trigger {
      padding: 8px 18px;
      background: linear-gradient(135deg, #d97706, #b45309);
      border: none;
      border-radius: 8px;
      color: white;
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-trigger:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(217,119,6,0.4); }

    .btn-stop {
      padding: 8px 18px;
      background: var(--surface3);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 8px;
      color: #f87171;
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-stop:hover { background: rgba(239,68,68,0.1); }

    /* DEVICE BODY */
    .device-body {
      padding: 24px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 1100px) {
      .device-body { grid-template-columns: 1fr 1fr; }
    }

    /* PANELS */
    .panel {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
    }

    .panel-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text3);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* BATTERY */
    .battery-display {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .battery-gauge {
      position: relative;
      width: 64px;
      height: 64px;
    }

    .battery-gauge svg {
      transform: rotate(-90deg);
    }

    .battery-gauge-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
    }

    .battery-meta p {
      font-size: 12px;
      color: var(--text2);
      margin-bottom: 4px;
    }

    .battery-meta span {
      font-weight: 600;
      color: var(--text);
    }

    .charging-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(59,130,246,0.15);
      border: 1px solid rgba(59,130,246,0.3);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      color: #93c5fd;
      margin-top: 4px;
    }

    /* LOCATION */
    .location-coords {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }

    .coord-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface3);
      padding: 8px 12px;
      border-radius: 8px;
    }

    .coord-label {
      font-size: 11px;
      color: var(--text3);
      font-family: var(--mono);
    }

    .coord-val {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      color: var(--accent2);
    }

    .map-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 10px;
      background: rgba(6,182,212,0.1);
      border: 1px solid rgba(6,182,212,0.3);
      border-radius: 8px;
      color: var(--accent2);
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .map-btn:hover { background: rgba(6,182,212,0.2); }

    .location-updated {
      font-size: 10px;
      color: var(--text3);
      font-family: var(--mono);
      margin-top: 8px;
      text-align: right;
    }

    .location-waiting {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text3);
      font-size: 12px;
      text-align: center;
      gap: 8px;
    }

    .spin {
      display: inline-block;
      animation: spin 1.5s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* CONTACTS PANEL - full width */
    .contacts-panel {
      grid-column: 1 / -1;
    }

    .contacts-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .contacts-count {
      background: rgba(59,130,246,0.15);
      border: 1px solid rgba(59,130,246,0.3);
      color: #93c5fd;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-family: var(--mono);
      font-weight: 600;
    }

    .contact-search {
      width: 100%;
      padding: 10px 14px;
      background: var(--surface3);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      margin-bottom: 12px;
      outline: none;
      transition: border-color 0.2s;
    }

    .contact-search:focus { border-color: var(--accent); }
    .contact-search::placeholder { color: var(--text3); }

    .contacts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 8px;
      max-height: 280px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .contacts-grid::-webkit-scrollbar { width: 4px; }
    .contacts-grid::-webkit-scrollbar-track { background: var(--surface3); border-radius: 4px; }
    .contacts-grid::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }

    .contact-chip {
      background: var(--surface3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      transition: border-color 0.2s;
    }

    .contact-chip:hover { border-color: rgba(59,130,246,0.3); }

    .contact-chip-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .contact-chip-detail {
      font-size: 11px;
      color: var(--text3);
      font-family: var(--mono);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* BUZZER ALERT BAR */
    .alert-bar {
      background: linear-gradient(135deg, #dc2626, #7f1d1d);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-top: 1px solid rgba(239,68,68,0.3);
    }

    .alert-bar-icon {
      font-size: 20px;
      animation: shake 0.4s infinite;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-3px); }
      75% { transform: translateX(3px); }
    }

    .alert-bar-text {
      font-size: 13px;
      font-weight: 700;
      color: white;
      letter-spacing: 0.05em;
    }

    /* EMPTY STATE */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 40px;
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    .empty-icon { font-size: 56px; margin-bottom: 20px; }
    .empty-title { font-size: 22px; font-weight: 600; margin-bottom: 10px; }
    .empty-sub { font-size: 14px; color: var(--text3); line-height: 1.7; }

    /* LOADING */
    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px;
      gap: 16px;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    /* ERROR */
    .error-panel {
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: 12px;
      padding: 24px;
      margin: 20px 0;
    }

    .error-panel h3 { color: #f87171; margin-bottom: 8px; }
    .error-panel p { color: var(--text2); font-size: 13px; line-height: 1.6; }

    .no-data-msg {
      font-size: 12px;
      color: var(--text3);
      font-style: italic;
      text-align: center;
      padding: 16px;
    }

    /* LAST SEEN */
    .last-seen {
      padding: 10px 24px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      font-family: var(--mono);
      color: var(--text3);
      text-align: right;
    }
  </style>
</head>
<body>
<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">🛡️</div>
      <div class="logo-title">SafeTrack</div>
      <div class="logo-sub">Child Safety System</div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">Overview</div>
      <div class="sidebar-stats">
        <div class="stat-row">
          <span class="stat-row-label">Total Devices</span>
          <span class="stat-row-val val-blue" id="sb-total">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-row-label">Online Now</span>
          <span class="stat-row-val val-green" id="sb-online">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-row-label">Offline</span>
          <span class="stat-row-val val-red" id="sb-offline">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-row-label">Total Contacts</span>
          <span class="stat-row-val val-blue" id="sb-contacts">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-row-label">Active Buzzers</span>
          <span class="stat-row-val val-orange" id="sb-buzzers">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-row-label">Tracking GPS</span>
          <span class="stat-row-val val-green" id="sb-gps">0</span>
        </div>
      </div>
    </div>

    <div class="sidebar-actions">
      <button class="btn-emergency" id="btnEmergency" onclick="triggerAllBuzzers()">
        🚨 EMERGENCY ALERT
      </button>
      <button class="btn-stop-all" onclick="stopAllBuzzers()">🔇 Stop All Buzzers</button>
      <button class="btn-refresh-sidebar" onclick="loadDevices()">🔄 Refresh</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="topbar">
      <div class="topbar-left">
        <h1>Device Monitor</h1>
        <p id="lastRefreshed">Last refresh: —</p>
      </div>
      <div class="ws-indicator" id="wsIndicator">
        <div class="ws-dot offline" id="wsDot"></div>
        <span id="wsText">Connecting...</span>
      </div>
    </div>

    <div class="content">
      <div id="devicesContainer" class="loading-state">
        <div class="loading-spinner"></div>
        <span style="color: var(--text3); font-size: 14px;">Loading devices...</span>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script>
  const API_URL = 'https://eventease-mobile-backend.onrender.com';

  let allContacts = {};
  let batteryData = {};
  let locationData = {};
  let buzzerStatus = {};
  let devicesCache = [];

  // ── WebSocket ──────────────────────────────────────────────────────────
  const socket = io(API_URL);

  socket.on('connect', () => {
    setWsStatus(true);
  });

  socket.on('disconnect', () => {
    setWsStatus(false);
  });

  function setWsStatus(connected) {
    const dot = document.getElementById('wsDot');
    const text = document.getElementById('wsText');
    if (connected) {
      dot.className = 'ws-dot';
      text.textContent = 'Live';
    } else {
      dot.className = 'ws-dot offline';
      text.textContent = 'Disconnected';
    }
  }

  socket.on('batteryUpdate', (data) => {
    batteryData[data.deviceId] = { level: data.batteryLevel, isCharging: data.isCharging, timestamp: data.timestamp };
    updateBatteryDisplay(data.deviceId);
  });

  socket.on('locationUpdate', (data) => {
    const prev = locationData[data.deviceId];
    locationData[data.deviceId] = { latitude: data.latitude, longitude: data.longitude, timestamp: data.timestamp };

    // Update GPS tracking count if this is first fix for device
    if (!prev) updateSidebarStats();
    updateLocationDisplay(data.deviceId);
  });

  socket.on('deviceConnected', (data) => {
    loadDevices();
  });

  socket.on('deviceDisconnected', (data) => {
    loadDevices();
  });

  // ── Buzzer ─────────────────────────────────────────────────────────────
  function triggerBuzzer(deviceId) {
    socket.emit('triggerBuzzer', { deviceId });
    buzzerStatus[deviceId] = true;
    applyBuzzerUI(deviceId, true);
    updateSidebarStats();
  }

  function stopBuzzer(deviceId) {
    socket.emit('stopBuzzer', { deviceId });
    buzzerStatus[deviceId] = false;
    applyBuzzerUI(deviceId, false);
    updateSidebarStats();
  }

  function triggerAllBuzzers() {
    if (!confirm('⚠️ EMERGENCY ALERT\n\nThis will trigger LOUD alarms on ALL connected devices at maximum volume.\n\nContinue?')) return;
    socket.emit('triggerAllBuzzers');
    devicesCache.forEach(d => { buzzerStatus[d.deviceId] = true; applyBuzzerUI(d.deviceId, true); });
    document.getElementById('btnEmergency').classList.add('active');
    updateSidebarStats();
  }

  function stopAllBuzzers() {
    socket.emit('stopAllBuzzers');
    Object.keys(buzzerStatus).forEach(id => { buzzerStatus[id] = false; applyBuzzerUI(id, false); });
    document.getElementById('btnEmergency').classList.remove('active');
    updateSidebarStats();
  }

  function applyBuzzerUI(deviceId, active) {
    const card = document.querySelector(`[data-device="${deviceId}"]`);
    if (!card) return;
    card.classList.toggle('buzzer-active', active);
    const alertBar = document.getElementById(`alert-${deviceId}`);
    if (alertBar) alertBar.style.display = active ? 'flex' : 'none';
    const badge = document.getElementById(`buzzer-badge-${deviceId}`);
    if (badge) { badge.style.display = active ? 'inline-flex' : 'none'; }
  }

  // ── Real-time updaters ─────────────────────────────────────────────────
  function updateBatteryDisplay(deviceId) {
    const el = document.getElementById(`battery-${deviceId}`);
    if (!el) return;
    const b = batteryData[deviceId];
    if (!b) return;

    const pct = b.level;
    const color = pct > 50 ? '#10b981' : pct > 20 ? '#f59e0b' : '#ef4444';
    const r = 26;
    const circ = 2 * Math.PI * r;
    const dash = (pct / 100) * circ;

    el.innerHTML = `
      <div class="battery-display">
        <div class="battery-gauge">
          <svg width="64" height="64" viewBox="0 0 64 64">
            <circle cx="32" cy="32" r="${r}" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="6"/>
            <circle cx="32" cy="32" r="${r}" fill="none" stroke="${color}" stroke-width="6"
              stroke-dasharray="${dash} ${circ}" stroke-linecap="round"/>
          </svg>
          <div class="battery-gauge-text" style="color:${color}">${pct}%</div>
        </div>
        <div class="battery-meta">
          <p>Level: <span>${pct}%</span></p>
          <p>Updated: <span>${formatTime(b.timestamp)}</span></p>
          ${b.isCharging ? '<div class="charging-tag">⚡ Charging</div>' : ''}
        </div>
      </div>`;
  }

  function updateLocationDisplay(deviceId) {
    const el = document.getElementById(`location-${deviceId}`);
    if (!el) return;
    const loc = locationData[deviceId];
    if (!loc) return;

    const mapsUrl = `https://www.google.com/maps?q=${loc.latitude},${loc.longitude}`;

    el.innerHTML = `
      <div class="location-coords">
        <div class="coord-item">
          <span class="coord-label">LAT</span>
          <span class="coord-val">${loc.latitude.toFixed(6)}</span>
        </div>
        <div class="coord-item">
          <span class="coord-label">LNG</span>
          <span class="coord-val">${loc.longitude.toFixed(6)}</span>
        </div>
      </div>
      <a class="map-btn" href="${mapsUrl}" target="_blank">🗺️ Open in Google Maps</a>
      <div class="location-updated">Updated: ${formatTime(loc.timestamp)}</div>`;
  }

  // ── Contact search ─────────────────────────────────────────────────────
  function filterContacts(deviceId, term) {
    const contacts = allContacts[deviceId] || [];
    const q = term.toLowerCase();
    const filtered = q ? contacts.filter(c =>
      (c.name || '').toLowerCase().includes(q) ||
      (c.phone || '').toLowerCase().includes(q) ||
      (c.email || '').toLowerCase().includes(q)
    ) : contacts;
    renderContactList(deviceId, filtered);
  }

  function renderContactList(deviceId, contacts) {
    const grid = document.getElementById(`contacts-grid-${deviceId}`);
    const cnt = document.getElementById(`contacts-count-${deviceId}`);
    if (!grid) return;
    cnt.textContent = contacts.length;

    if (!contacts.length) {
      grid.innerHTML = '<div class="no-data-msg">No contacts found</div>';
      return;
    }

    grid.innerHTML = contacts.map(c => `
      <div class="contact-chip">
        <div class="contact-chip-name">${c.name || 'Unknown'}</div>
        ${c.phone ? `<div class="contact-chip-detail">📞 ${c.phone}</div>` : ''}
        ${c.email ? `<div class="contact-chip-detail">📧 ${c.email}</div>` : ''}
      </div>
    `).join('');
  }

  // ── Sidebar stats ──────────────────────────────────────────────────────
  function updateSidebarStats() {
    const total = devicesCache.length;
    const online = devicesCache.filter(d => isOnline(d.lastSeen)).length;
    const contacts = devicesCache.reduce((s, d) => s + (d.contactCount || 0), 0);
    const buzzers = Object.values(buzzerStatus).filter(Boolean).length;
    const gps = Object.keys(locationData).filter(id => locationData[id]?.latitude).length;

    document.getElementById('sb-total').textContent = total;
    document.getElementById('sb-online').textContent = online;
    document.getElementById('sb-offline').textContent = total - online;
    document.getElementById('sb-contacts').textContent = contacts;
    document.getElementById('sb-buzzers').textContent = buzzers;
    document.getElementById('sb-gps').textContent = gps;
  }

  // ── Render ─────────────────────────────────────────────────────────────
  function renderDevices(devices) {
    devicesCache = devices;
    updateSidebarStats();

    const container = document.getElementById('devicesContainer');
    container.className = 'devices-list';

    if (!devices.length) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">📱</div>
          <div class="empty-title">No Devices Connected</div>
          <div class="empty-sub">Install the Flutter app on a device and it will automatically appear here.<br>You'll be able to monitor battery, location, and contacts in real time.</div>
        </div>`;
      return;
    }

    container.innerHTML = devices.map(device => {
      const online = isOnline(device.lastSeen);
      allContacts[device.deviceId] = device.contacts || [];
      const battery = batteryData[device.deviceId];
      const loc = locationData[device.deviceId];
      const isBuzzer = buzzerStatus[device.deviceId];
      const pct = battery ? battery.level : null;
      const color = pct !== null ? (pct > 50 ? '#10b981' : pct > 20 ? '#f59e0b' : '#ef4444') : '#64748b';
      const r = 26;
      const circ = 2 * Math.PI * r;
      const dash = pct !== null ? (pct / 100) * circ : 0;
      const mapsUrl = loc ? `https://www.google.com/maps?q=${loc.latitude},${loc.longitude}` : '#';

      return `
        <div class="device-card ${isBuzzer ? 'buzzer-active' : ''}" data-device="${device.deviceId}">

          <div class="device-header">
            <div class="device-header-left">
              <div class="device-icon">📱</div>
              <div>
                <div class="device-name">${device.manufacturer} ${device.model}</div>
                <div class="device-id-text">${device.deviceId.substring(0, 32)}${device.deviceId.length > 32 ? '…' : ''}</div>
              </div>
            </div>
            <div class="device-header-right">
              <span class="badge ${online ? 'badge-online' : 'badge-offline'}">${online ? '● ONLINE' : '● OFFLINE'}</span>
              <span class="badge badge-buzzer" id="buzzer-badge-${device.deviceId}" style="display:${isBuzzer ? 'inline-flex' : 'none'}">🔊 ALARM</span>
              <div class="buzzer-btns">
                <button class="btn-trigger" onclick="triggerBuzzer('${device.deviceId}')">🔊 Trigger</button>
                <button class="btn-stop" onclick="stopBuzzer('${device.deviceId}')">🔇 Stop</button>
              </div>
            </div>
          </div>

          <div class="alert-bar" id="alert-${device.deviceId}" style="display:${isBuzzer ? 'flex' : 'none'}">
            <span class="alert-bar-icon">🚨</span>
            <span class="alert-bar-text">BUZZER ACTIVE — Device is sounding at maximum volume</span>
          </div>

          <div class="device-body">

            <!-- Battery -->
            <div class="panel">
              <div class="panel-title">🔋 Battery</div>
              <div id="battery-${device.deviceId}">
                ${battery ? `
                  <div class="battery-display">
                    <div class="battery-gauge">
                      <svg width="64" height="64" viewBox="0 0 64 64">
                        <circle cx="32" cy="32" r="${r}" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="6"/>
                        <circle cx="32" cy="32" r="${r}" fill="none" stroke="${color}" stroke-width="6"
                          stroke-dasharray="${dash} ${circ}" stroke-linecap="round"/>
                      </svg>
                      <div class="battery-gauge-text" style="color:${color}">${pct}%</div>
                    </div>
                    <div class="battery-meta">
                      <p>Level: <span>${pct}%</span></p>
                      <p>Updated: <span>${formatTime(battery.timestamp)}</span></p>
                      ${battery.isCharging ? '<div class="charging-tag">⚡ Charging</div>' : ''}
                    </div>
                  </div>` : '<div class="no-data-msg"><span class="spin">⟳</span> Waiting for battery data...</div>'}
              </div>
            </div>

            <!-- Location -->
            <div class="panel">
              <div class="panel-title">📍 Live Location</div>
              <div id="location-${device.deviceId}">
                ${loc ? `
                  <div class="location-coords">
                    <div class="coord-item">
                      <span class="coord-label">LAT</span>
                      <span class="coord-val">${loc.latitude.toFixed(6)}</span>
                    </div>
                    <div class="coord-item">
                      <span class="coord-label">LNG</span>
                      <span class="coord-val">${loc.longitude.toFixed(6)}</span>
                    </div>
                  </div>
                  <a class="map-btn" href="${mapsUrl}" target="_blank">🗺️ Open in Google Maps</a>
                  <div class="location-updated">Updated: ${formatTime(loc.timestamp)}</div>
                ` : `
                  <div class="location-waiting">
                    <span class="spin" style="font-size:20px">⟳</span>
                    Waiting for GPS fix...
                  </div>`}
              </div>
            </div>

            <!-- Contacts - full width -->
            <div class="panel contacts-panel">
              <div class="contacts-header">
                <div class="panel-title" style="margin:0">📞 Contacts</div>
                <span class="contacts-count" id="contacts-count-${device.deviceId}">${device.contacts.length}</span>
              </div>
              <input class="contact-search" type="text" placeholder="🔍 Search by name, phone or email..."
                oninput="filterContacts('${device.deviceId}', this.value)" />
              <div class="contacts-grid" id="contacts-grid-${device.deviceId}">
                ${device.contacts.length ? device.contacts.map(c => `
                  <div class="contact-chip">
                    <div class="contact-chip-name">${c.name || 'Unknown'}</div>
                    ${c.phone ? `<div class="contact-chip-detail">📞 ${c.phone}</div>` : ''}
                    ${c.email ? `<div class="contact-chip-detail">📧 ${c.email}</div>` : ''}
                  </div>`).join('') : '<div class="no-data-msg">No contacts collected yet</div>'}
              </div>
            </div>

          </div>

          <div class="last-seen">Android ${device.androidVersion || 'Unknown'} · Last seen: ${formatDate(device.lastSeen)}</div>
        </div>`;
    }).join('');
  }

  // ── Load devices ───────────────────────────────────────────────────────
  async function loadDevices() {
    try {
      const res = await fetch(`${API_URL}/api/child-safety/devices`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const devices = await res.json();
      renderDevices(devices);
      document.getElementById('lastRefreshed').textContent = `Last refresh: ${new Date().toLocaleTimeString()}`;
    } catch (err) {
      document.getElementById('devicesContainer').innerHTML = `
        <div class="error-panel">
          <h3>❌ Cannot Connect to Backend</h3>
          <p>Make sure your Node.js server is running on <strong>${API_URL}</strong><br><br>
          Error: ${err.message}<br><br>
          Check: MongoDB is running · <code>npm start</code> is running · Refresh this page</p>
        </div>`;
    }
  }

  // ── Helpers ────────────────────────────────────────────────────────────
  function isOnline(lastSeen) {
    return new Date(lastSeen) > new Date(Date.now() - 5 * 60 * 1000);
  }

  function formatTime(d) {
    return new Date(d).toLocaleTimeString();
  }

  function formatDate(d) {
    return new Date(d).toLocaleString();
  }

  // ── Init ───────────────────────────────────────────────────────────────
  loadDevices();
  setInterval(loadDevices, 10000);
</script>
</body>
</html>
